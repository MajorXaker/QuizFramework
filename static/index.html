<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" />
    <title data-i18n="app.title">Quiz Helper</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<main id="app">
    <!-- Landing -->
    <section id="view-landing" class="view active">
        <h1 data-i18n="app.title">Quiz Helper</h1>
        <p class="muted" data-i18n="app.subtitle">Real-life quiz buzzer. Host or join in seconds.</p>
        <div class="lang-switcher">
            <button type="button" data-lang-switch="en">EN</button>
            <button type="button" data-lang-switch="ru">RU</button>
        </div>

        <form id="form-host" autocomplete="off">
            <h2 data-i18n="welcome.createRoomTitle">Start a new game</h2>
            <label for="host-name"  data-i18n="welcome.enterHostName">Your name (host)</label>
            <input id="host-name" maxlength="32" required />
            <button type="submit" class="primary" data-i18n="welcome.createRoomButton">Create game</button>
        </form>

        <hr />

        <form id="form-join" autocomplete="off">
            <h2 data-i18n="welcome.joinTitle">Join a game</h2>
            <label for="join-name" data-i18n="welcome.enterPlayerName">Your name</label>
            <input id="join-name" maxlength="32" required />
            <label for="join-code" data-i18n="welcome.enterInviteCode">Invite code</label>
            <input id="join-code" maxlength="8" pattern="[a-z0-9]{8}" required
                       inputmode="latin" autocapitalize="off" spellcheck="false" />
            <button type="submit" class="primary" data-i18n="welcome.join">Join</button>
        </form>

        <p id="landing-error" class="error"></p>
    </section>

    <!-- Player game view -->
    <section id="view-player" class="view">
        <header class="bar">
            <span class="who" id="player-who"></span>
            <button id="player-leave" class="link" data-i18n="player.leave">Leave</button>
        </header>
        <div id="player-status" class="status" data-i18n="player.wait">Waiting for host…</div>

        <button id="answer-btn" class="answer-btn" disabled data-i18n="player.answer">I know!</button>

        <div id="winner-banner" class="banner hidden"></div>

        <details class="roster">
            <summary data-i18n="player.list">Players</summary>
            <ul id="player-roster"></ul>
        </details>
    </section>

    <!-- Host view -->
    <section id="view-host" class="view">
        <header class="bar">
            <span class="who" id="host-who"></span>
            <button id="host-close" class="link danger" data-i18n="host.close">Close game</button>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="game" data-i18n="host.gameTab">Game</button>
            <button class="tab" data-tab="config" data-i18n="host.configTab">Configuration</button>
        </nav>

        <!-- Game tab -->
        <section id="tab-game" class="tab-pane active">
            <div class="invite-card">
                <div class="muted" data-i18n="welcome.enterInviteCode">Invite code</div>
                <div class="invite-code" id="invite-code-display">--------</div>
            </div>

            <div class="round-controls">
                <button id="btn-start-round" class="primary big" data-i18n="host.questionStart">Start question</button>
                <button id="btn-stop-round" class="danger big" disabled data-i18n="host.questionStop">Stop question</button>
            </div>

            <div id="host-winner" class="banner hidden"></div>
            <div id="host-status" class="status muted"></div>

            <h3 data-i18n="player.list">Players</h3>
            <ul id="host-roster"></ul>
        </section>

        <!-- Configuration tab -->
        <section id="tab-config" class="tab-pane">
            <div class="invite-card">
                <div class="muted">Invite code</div>
                <div class="invite-code" id="config-code-display">--------</div>
                <button id="btn-regen-code" data-i18n="host.regenerateInvite">Regenerate</button>
            </div>

            <div class="toggle-row">
                <label class="switch">
                    <input type="checkbox" id="toggle-joins" />
                    <span data-i18n="host.allowJoin">Allow new players to join</span>
                </label>
            </div>
            <div class="toggle-row">
                <label class="switch">
                    <input type="checkbox" id="toggle-answers" />
                    <span data-i18n="host.answerMode">Answer mode (players see buzzer)</span>
                </label>
            </div>

            <h3 data-i18n="player.list">Players</h3>
            <ul id="config-roster"></ul>
        </section>
    </section>
</main>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
