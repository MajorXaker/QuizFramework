<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="app.title">Live quiz</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="top-bar">
      <h1 data-i18n="app.title">Live quiz</h1>
      <span class="subtitle" data-i18n="app.subtitle">Real-time quiz framework</span>
      <div class="lang-switcher">
        <button type="button" data-lang-switch="en">EN</button>
        <button type="button" data-lang-switch="ru">RU</button>
      </div>
    </header>

    <main>
      <section id="join-section">
        <label>
          <span data-i18n="login.roomCode">Room code</span>
          <input
            id="room-code-input"
            type="text"
            data-i18n="login.roomCode"
            data-i18n-attr="placeholder"
            placeholder="Room code"
          />
        </label>
        <label>
          <span data-i18n="login.userName">Your name</span>
          <input
            id="user-name-input"
            type="text"
            data-i18n="login.userName"
            data-i18n-attr="placeholder"
            placeholder="Your name"
          />
        </label>
        <button id="join-button" data-i18n="login.join">Join</button>
      </section>

      <section id="admin-section">
        <button id="create-room" data-i18n="admin.createRoom">Create room</button>
        <button id="start-quiz" data-i18n="admin.startQuiz">Start quiz</button>
        <button id="next-question" data-i18n="admin.nextQuestion">Next question</button>
        <button id="end-quiz" data-i18n="admin.endQuiz">End quiz</button>
      </section>

      <section id="status-section">
        <p id="waiting" data-i18n="quiz.waitingForPlayers">Waiting for players...</p>
      </section>

      <section id="question-section">
        <h2 data-i18n="quiz.question">Question</h2>
        <p id="question-text"></p>
        <input
          id="answer-input"
          type="text"
          data-i18n="quiz.yourAnswer"
          data-i18n-attr="placeholder"
          placeholder="Your answer"
        />
        <button id="submit-answer" data-i18n="quiz.submit">Submit</button>
      </section>

      <section id="score-section">
        <h2 data-i18n="quiz.score">Score</h2>
        <div id="score-table"></div>
      </section>
    </main>

    <script src="/static/i18n.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
